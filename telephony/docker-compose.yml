services:
  asterisk:
    image: andrius/asterisk:latest
    volumes:
      - ./asterisk/configs/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/configs/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk/configs/rtp.conf:/etc/asterisk/rtp.conf
    ports:
      - "5060:5060/udp"
      - "10000-10020:10000-10020/udp"
    networks:
      sip_gateway:
        ipv4_address: 192.168.107.2

  gateway:
    build:
      context: ./gateway
    ports:
      - "9050:9050"
    environment:
      GATEWAY_SIP_PORT: "5080"
      GATEWAY_HTTP_PORT: "80"
      GATEWAY_STUN_SERVER: "stun:stun.l.google.com:19302"
      GATEWAY_RECORDING_DIR: "/recordings"
      GATEWAY_PUBLIC_IP: "192.168.107.3"
      CHATWOOT_WEBHOOK_URL: "http://rails:3000/webhooks/sip_gateway/events"
      CHATWOOT_WEBHOOK_SECRET: "test"
      SIP_SERVER_HOST: "192.168.107.2"
      SIP_SERVER_PORT: "5060"
      GATEWAY_ICE_TCP_PORT: "9050"
      GATEWAY_ICE_TCP_ADDR: "0.0.0.0"
      GATEWAY_ICE_NAT_IP: "192.168.107.3"

    volumes:
      - ./recordings:/recordings
    depends_on:
      - asterisk
    networks:
      sip_gateway:
        ipv4_address: 192.168.107.3

networks:
  sip_gateway:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.107.0/24
