[general]
static=yes

[from-internal]
; Customer (ext 1001) calls any number -> route to gateway
exten => _[+0-9]X.,1,NoOp(Inbound from customer: ${CALLERID(num)} -> ${EXTEN})
same => n,Set(CALLERID(num)=+201144444444)
same => n,Dial(PJSIP/+966555555555@gateway,30)
same => n,Hangup()

[from-gateway]
; Gateway initiates outbound -> dial the matching extension
exten => _[+0-9]X.,1,NoOp(Outbound from gateway to ${EXTEN})
same => n,Dial(PJSIP/1001,30) ; always dial 1001 for testing
same => n,Hangup()
