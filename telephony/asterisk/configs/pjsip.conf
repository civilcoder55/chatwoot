; Transport
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.107.2
external_signaling_address=192.168.107.2

; Gateway trunk (IP-based, no registration)
[gateway]
type=endpoint
context=from-gateway
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
identify_by=ip
transport=transport-udp
aors=gateway

[gateway]
type = aor
contact = sip:192.168.107.3:5080
max_contacts = 4
qualify_frequency = 0

[gateway-identify]
type=identify
endpoint=gateway
match=192.168.107.3

; Test SIP phone (customer simulation)
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
transport=transport-udp

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=test1001

[1001]
type=aor
max_contacts=1
qualify_frequency = 60
